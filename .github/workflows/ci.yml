name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install trainer dependencies
        run: npm install --prefix apps/regional-anesthesia-trainer
      - name: Ultrasound asset guard
        run: npm run test:assets
      - name: Core smoke test
        run: npm run test:core
      - name: Typecheck
        run: npm run typecheck
      - name: Trainer tests
        run: npm run test:trainer
      - name: Production build
        run: npm run build
      - name: Built ultrasound asset guard
        run: npm run test:assets -- --dist
      - name: Add preview launcher notes
        run: |
          cat > apps/regional-anesthesia-trainer/dist/START_PREVIEW.txt <<'EOF'
          Regional Anesthesia Trainer Preview

          Serve this folder through a local HTTP server (ES modules/workers should not be opened directly with file://).

          Python 3:
            python -m http.server 4173
          Then open:
            http://localhost:4173

          Node alternative:
            npx serve .
          EOF
      - name: Upload trainer preview
        uses: actions/upload-artifact@v4
        with:
          name: regional-anesthesia-trainer-preview-${{ github.sha }}
          path: apps/regional-anesthesia-trainer/dist
          if-no-files-found: error
          retention-days: 14
