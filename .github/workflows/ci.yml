name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install trainer dependencies
        run: npm install --prefix apps/regional-anesthesia-trainer
      - name: Core smoke test
        run: npm run test:core
      - name: Typecheck
        run: npm run typecheck
      - name: Trainer tests
        run: npm run test:trainer
      - name: Production build
        run: npm run build
