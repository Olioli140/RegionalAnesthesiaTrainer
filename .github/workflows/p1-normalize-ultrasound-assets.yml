name: P1 Generate Ultrasound Assets

on:
  push:
    branches:
      - feature/ac-us-asset-p1

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip-generate]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ac-us-asset-p1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Generate deterministic WebP reference stack
        run: python scripts/generate-adductor-reference-stack.py
      - name: Commit generated binaries
        run: |
          if git diff --quiet -- apps/regional-anesthesia-trainer/public/assets/ultrasound/adductor-canal/v0.1; then
            echo "No binary changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/regional-anesthesia-trainer/public/assets/ultrasound/adductor-canal/v0.1
          git commit -m "P1: generate deterministic WebP stack [skip-generate]"
          git push origin HEAD:feature/ac-us-asset-p1
