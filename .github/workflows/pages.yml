name: Deploy Trainer Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install trainer dependencies
        run: npm install --prefix apps/regional-anesthesia-trainer
      - name: Validate core
        run: npm run test:core
      - name: Typecheck
        run: npm run typecheck
      - name: Trainer tests
        run: npm run test:trainer
      - name: Build Pages preview
        env:
          GITHUB_PAGES: 'true'
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/regional-anesthesia-trainer/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
